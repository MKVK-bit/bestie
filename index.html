<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Bestiee — Tonight at Midnight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Exciting intro: particles converge + title -->
<div id="introGate">
  <canvas id="introCanvas"></canvas>
  <h1 class="intro-title" id="introTitleText">For Bestiee</h1>
</div>

<!-- Gold gates that slide open after intro -->
<div id="gates">
  <div class="gate-panel left"></div>
  <div class="gate-panel right"></div>
</div>

<canvas id="sparkles"></canvas>
<canvas id="fireworks"></canvas>
<div class="glow-bg"></div>

<div id="progressDots">
  <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
</div>

<div class="page">
  <div class="wrap">
    <div class="frame">
      <svg class="emblem" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#d4af37" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="32" fill="none" stroke="#ffe08a" stroke-width="1"/>
        <polygon points="50,22 58,44 82,44 62,58 70,80 50,66 30,80 38,58 18,44 42,44" fill="#d4af37"/>
      </svg>
      <p class="eyebrow">A Golden Invitation</p>
      <h1 class="title" id="mainTitle">For Bestiee</h1>
      <p class="subtitle">Sindhu, this is only for you. Something special is locked away, waiting for your birthday. It opens tonight, right at midnight.</p>

      <div class="divider"></div>

      <div id="countdown">
        <div class="cd-block"><span class="cd-num" id="cd-days">00</span><span class="cd-label">days</span></div>
        <div class="cd-colon">:</div>
        <div class="cd-block"><span class="cd-num" id="cd-hours">00</span><span class="cd-label">hrs</span></div>
        <div class="cd-colon">:</div>
        <div class="cd-block"><span class="cd-num" id="cd-min">00</span><span class="cd-label">min</span></div>
        <div class="cd-colon">:</div>
        <div class="cd-block"><span class="cd-num" id="cd-sec">00</span><span class="cd-label">sec</span></div>
      </div>

      <div id="gift-stage">
        <div id="giftbox">
          <svg viewBox="0 0 170 170">
            <g class="seal-top">
              <circle cx="85" cy="85" r="55" fill="#0d0d0d" stroke="#d4af37" stroke-width="2.5"/>
              <circle cx="85" cy="85" r="42" fill="none" stroke="#ffe08a" stroke-width="1"/>
              <polygon points="85,55 92,75 113,75 96,88 103,109 85,96 67,109 74,88 57,75 78,75" fill="#d4af37"/>
            </g>
            <g class="seal-crack" stroke="#ffe08a" stroke-width="1.5">
              <line x1="55" y1="60" x2="75" y2="85"/>
              <line x1="115" y1="60" x2="95" y2="85"/>
              <line x1="85" y1="130" x2="85" y2="100"/>
            </g>
          </svg>
        </div>
        <p class="box-lock-text" id="lockText">Sealed until midnight</p>
        <p class="box-ready-text">Tap the seal to break it open</p>
      </div>

      <a href="memories.html" id="continueBtn" class="btn">Continue</a>
    </div>
    <p class="note">made just for you, Bestiee</p>
  </div>
</div>

<button id="soundToggle" title="Toggle music">♪</button>

<script src="script.js"></script>
<script>
markProgress(1);
startIntro();
startSparkles();
wireSoundToggle();
animateTitle('#mainTitle');

const giftbox = document.getElementById('giftbox');
const lockText = document.getElementById('lockText');
const continueBtn = document.getElementById('continueBtn');
const countdownWrap = document.getElementById('countdown');

function onUnlocked(){
  countdownWrap.style.display = 'none';
  lockText.style.display = 'none';
  giftbox.classList.add('ready');
}

startCountdown(onUnlocked);
if(Date.now() >= SURPRISE_TARGET){ onUnlocked(); }

giftbox.addEventListener('click', ()=>{
  if(!giftbox.classList.contains('ready')) return;
  giftbox.classList.remove('ready');
  giftbox.classList.add('opening');
  document.querySelector('.box-ready-text').style.display = 'none';
  startMusic();
  setTimeout(gongSwell, 150);
  fireworksBurst(3);
  setTimeout(()=>fireworksBurst(2), 700);

  setTimeout(()=>{
    continueBtn.style.display = 'inline-block';
  }, 1600);
});
</script>
</body>
</html>
